<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Tepuk Tikus</title>
<style>
  :root {
    --cream: #f7f2e9;
    --cream-deep: #efe3ce;
    --sage: #9caf88;
    --sage-light: #cddabd;
    --sage-dark: #5f7350;
    --sand: #ddc7a1;
    --sand-dark: #ad8f65;
    --rose: #cf9d97;
    --rose-dark: #a9716c;
    --charcoal: #4a4136;
    --burrow: #8a7256;
    --burrow-deep: #5c4a35;
    --unicorn-glow: rgba(198, 163, 209, 0.65);
    --dragon-glow: rgba(224, 178, 96, 0.75);

    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }

  * {
    box-sizing: border-box; margin: 0; padding: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none;
    touch-action: none; background: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--charcoal);
  }
  body { background: linear-gradient(180deg, var(--cream) 0%, var(--cream-deep) 55%, var(--sage-light) 100%); }

  .petals {
    flex: 0 0 auto; height: 14px;
    background-image: radial-gradient(circle, rgba(255,255,255,0.9) 0%, var(--rose) 40%, transparent 70%);
    background-size: 26px 14px; background-repeat: repeat-x; background-position: center;
    opacity: 0.8;
  }

  #rotateOverlay {
    display: none; position: fixed; inset: 0; z-index: 9999; background: var(--cream);
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 14px; padding: 24px;
  }
  .rotate-icon { font-size: 3.6rem; animation: rotateHint 1.6s ease-in-out infinite; }
  @keyframes rotateHint { 0%, 100% { transform: rotate(-32deg); } 50% { transform: rotate(32deg); } }
  #rotateOverlay p { max-width: 26ch; font-size: 1.02rem; }
  @media (orientation: landscape) and (pointer: coarse) {
    #rotateOverlay { display: flex; }
    #app { display: none; }
  }

  #app {
    position: fixed; inset: 0; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    padding-top: var(--safe-t); padding-left: var(--safe-l); padding-right: var(--safe-r);
    overflow: hidden;
  }
  .screens { flex: 1 1 auto; min-height: 0; display: flex; }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 16px calc(12px + var(--safe-b)); }
  .screen.hidden { display: none; }

  #startScreen, #endScreen { align-items: center; justify-content: center; text-align: center; gap: 14px; overflow-y: auto; }
  #gameScreen { gap: 10px; }

  .title { font-size: clamp(1.8rem, 9vw, 2.5rem); font-weight: 700; color: var(--sage-dark); text-shadow: 0 2px 0 rgba(255,255,255,0.6); }
  .title.champion { color: var(--rose-dark); text-shadow: 0 0 16px rgba(169,113,108,0.45), 0 2px 0 rgba(255,255,255,0.6); }
  .subtitle { color: var(--charcoal); opacity: 0.75; font-size: clamp(0.9rem, 4vw, 1.05rem); max-width: 32ch; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .legend-item {
    display: flex; align-items: center; gap: 5px; background: var(--cream);
    border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 0.85rem;
    box-shadow: 0 3px 8px rgba(74,65,54,0.1);
  }
  .legend-item .emo { font-size: 1.1rem; }
  .legend-item.rare { color: var(--rose-dark); }

  .info-card {
    background: var(--cream); border-radius: 16px; padding: 10px 20px;
    box-shadow: 0 4px 14px rgba(74,65,54,0.12); display: flex; align-items: center; gap: 10px;
  }
  .info-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6; }
  .info-value { font-size: 1.3rem; font-weight: 800; }

  .btn {
    touch-action: manipulation; border: none; border-radius: 999px; padding: 15px 40px;
    font-size: clamp(1rem, 4.4vw, 1.15rem); font-weight: 800; letter-spacing: 0.02em;
    color: var(--cream); background: linear-gradient(180deg, var(--rose), var(--rose-dark));
    box-shadow: 0 5px 0 #7d5450, 0 8px 16px rgba(74,65,54,0.3); transition: transform 0.08s, box-shadow 0.08s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #7d5450, 0 3px 8px rgba(74,65,54,0.3); }
  .btn:focus-visible { outline: 3px solid var(--sage-dark); outline-offset: 3px; }

  .trophy-display { font-size: 4.5rem; filter: drop-shadow(0 4px 10px rgba(169,113,108,0.4)); }
  .trophy-display.hidden { display: none; }
  .trophy-display:not(.hidden) { animation: trophyPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes trophyPop { 0% { transform: scale(0) rotate(-15deg); opacity: 0; } 60% { transform: scale(1.15) rotate(5deg); opacity: 1; } 100% { transform: scale(1) rotate(0deg); } }

  /* ===== Panel skor ===== */
  #scorePanel { flex: 0 0 auto; background: var(--cream); border-radius: 16px; padding: 10px 14px 12px; box-shadow: 0 4px 14px rgba(74,65,54,0.12); }
  .score-row { display: flex; align-items: center; gap: 6px; }
  .score-box, .combo-box { flex: 1; text-align: center; }
  .score-label { font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.6; }
  .score-value { font-size: clamp(1.2rem, 5.6vw, 1.6rem); font-weight: 800; font-variant-numeric: tabular-nums; }
  .score-value.small { font-size: clamp(1rem, 4.4vw, 1.15rem); opacity: 0.85; }
  .combo-value { font-size: clamp(1.2rem, 5.6vw, 1.6rem); font-weight: 800; color: rgba(74,65,54,0.35); transition: color 0.2s; }
  .combo-value.active { color: var(--rose-dark); }
  .combo-box.pulse { animation: comboPulse 0.3s ease; }
  @keyframes comboPulse { 0% { transform: scale(1); } 50% { transform: scale(1.26); } 100% { transform: scale(1); } }

  .timer-track { width: 100%; height: 9px; background: rgba(74,65,54,0.15); border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .timer-bar { height: 100%; width: 100%; background: var(--sage); border-radius: 6px; }
  .timer-bar.warn { background: #d8a24a; }
  .timer-bar.danger { background: var(--rose-dark); }

  /* ===== Papan & lubang ===== */
  .board {
    position: relative; flex: 1; min-height: 0;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    gap: 6px; background: var(--sand-dark); border-radius: 16px; padding: 7px;
    box-shadow: inset 0 0 0 2px rgba(74,65,54,0.1); touch-action: none;
  }
  .hole {
    position: relative; min-width: 0; min-height: 0;
    background: linear-gradient(180deg, var(--sand), var(--sand-dark));
    border-radius: 12px; box-shadow: inset 0 2px 3px rgba(255,255,255,0.35), 0 2px 0 rgba(74,65,54,0.15);
    overflow: visible;
  }
  .burrow {
    position: absolute; left: 50%; bottom: 8%; width: 74%; height: 58%; transform: translateX(-50%);
    border-radius: 50%; background: radial-gradient(ellipse at 50% 32%, var(--burrow) 0%, var(--burrow-deep) 68%, var(--burrow-deep) 100%);
    box-shadow: inset 0 7px 12px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.12);
    pointer-events: none;
  }
  .hole.special-unicorn .burrow { box-shadow: 0 0 18px 7px var(--unicorn-glow), inset 0 7px 12px rgba(0,0,0,0.5); animation: specialPulse 0.5s ease-in-out infinite; }
  .hole.special-dragon .burrow { box-shadow: 0 0 22px 9px var(--dragon-glow), inset 0 7px 12px rgba(0,0,0,0.5); animation: specialPulse 0.4s ease-in-out infinite; }
  @keyframes specialPulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }

  .critter {
    position: absolute; left: 50%; bottom: 12%; font-size: clamp(1.9rem, 11vw, 3.6rem); line-height: 1;
    transform: translateX(-50%) translateY(60%) scale(0.6); opacity: 0; pointer-events: none;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,0.35)); will-change: transform, opacity;
  }
  .critter.pop { animation: popUp 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  .critter.retreat { animation: retreatDown 0.22s ease-in forwards; }
  .critter.hit { animation: hitPop 0.26s ease-out forwards; }
  @keyframes popUp { 0% { transform: translateX(-50%) translateY(60%) scale(0.6); opacity: 0; } 55% { transform: translateX(-50%) translateY(-8%) scale(1.08); opacity: 1; } 100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; } }
  @keyframes retreatDown { 0% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; } 100% { transform: translateX(-50%) translateY(60%) scale(0.6); opacity: 0; } }
  @keyframes hitPop { 0% { transform: translateX(-50%) translateY(0) scale(1) rotate(0deg); opacity: 1; } 35% { transform: translateX(-50%) translateY(-25%) scale(1.35) rotate(-8deg); opacity: 1; } 100% { transform: translateX(-50%) translateY(-15%) scale(0.15) rotate(15deg); opacity: 0; } }

  .hole.danger-flash { animation: flashDanger 0.3s ease; }
  @keyframes flashDanger { 0%, 100% { filter: brightness(1); } 30% { filter: brightness(1.7) saturate(1.3); } }

  .float-score {
    position: absolute; left: 50%; top: 22%; transform: translateX(-50%);
    font-weight: 800; font-size: clamp(0.85rem, 4vw, 1.1rem); color: var(--sage-dark);
    pointer-events: none; z-index: 6; animation: floatUp 0.7s ease-out forwards;
  }
  .float-score.negative { color: var(--rose-dark); }
  @keyframes floatUp { 0% { transform: translateX(-50%) translateY(0); opacity: 1; } 100% { transform: translateX(-50%) translateY(-34px); opacity: 0; } }

  .rare-banner {
    position: absolute; inset: 8px; display: flex; align-items: center; justify-content: center;
    font-size: clamp(1rem, 4.6vw, 1.4rem); font-weight: 800; color: var(--charcoal);
    background: rgba(247,242,233,0.88); border-radius: 14px; pointer-events: none; z-index: 10;
    text-align: center; animation: bannerPop 0.85s ease-out forwards;
  }
  @keyframes bannerPop { 0% { opacity: 0; transform: scale(0.85); } 15% { opacity: 1; transform: scale(1.04); } 25% { transform: scale(1); } 78% { opacity: 1; } 100% { opacity: 0; } }

  /* ===== Layar hasil ===== */
  .result-card { background: var(--cream); border-radius: 18px; padding: 6px 24px; min-width: 240px; box-shadow: 0 4px 14px rgba(74,65,54,0.12); }
  .result-row { display: flex; justify-content: space-between; gap: 18px; padding: 8px 0; border-bottom: 1px dashed rgba(74,65,54,0.18); font-size: 0.96rem; }
  .result-row:last-child { border-bottom: none; }
  .result-row strong { font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) {
    .rotate-icon { animation: none; }
    .combo-box.pulse { animation: none; }
    .trophy-display:not(.hidden) { animation: none; }
    .critter.pop, .critter.retreat, .critter.hit { animation-duration: 0.01ms; animation-iteration-count: 1; }
    .hole.danger-flash, .hole.special-unicorn .burrow, .hole.special-dragon .burrow { animation: none; }
  }
</style>
</head>
<body>

<div id="rotateOverlay">
  <div class="rotate-icon">📱</div>
  <p>Putar HP ke posisi tegak (potrait) untuk lanjut main</p>
</div>

<div id="app">
  <div class="petals" aria-hidden="true"></div>

  <div class="screens">
    <!-- LAYAR AWAL -->
    <div id="startScreen" class="screen">
      <div class="title">🐭 Tepuk Tikus</div>
      <p class="subtitle">Ketuk yang muncul dari lubang, kumpulkan poin sebanyak-banyaknya!</p>
      <div class="legend">
        <div class="legend-item"><span class="emo">🐭</span>+10</div>
        <div class="legend-item rare"><span class="emo">🦄</span>+20</div>
        <div class="legend-item rare"><span class="emo">🐉</span>+50</div>
        <div class="legend-item"><span class="emo">💣</span>−20</div>
      </div>
      <div class="info-card">
        <span class="info-label">Skor&nbsp;Terbaik</span>
        <span class="info-value" id="bestScoreStart">0</span>
      </div>
      <button id="startBtn" class="btn">Mulai Main</button>
    </div>

    <!-- LAYAR PERMAINAN -->
    <div id="gameScreen" class="screen hidden">
      <div id="scorePanel">
        <div class="score-row">
          <div class="score-box">
            <div class="score-label">Skor</div>
            <div id="scoreValue" class="score-value">0</div>
          </div>
          <div class="combo-box" id="comboBox">
            <div class="score-label">Combo</div>
            <div id="comboValue" class="combo-value">x1</div>
          </div>
          <div class="score-box">
            <div class="score-label">Terbaik</div>
            <div id="bestScoreValue" class="score-value small">0</div>
          </div>
        </div>
        <div class="timer-track"><div id="timerBar" class="timer-bar"></div></div>
      </div>
      <div id="board" class="board"></div>
    </div>

    <!-- LAYAR HASIL -->
    <div id="endScreen" class="screen hidden">
      <div id="trophyDisplay" class="trophy-display hidden">🏆</div>
      <div class="title" id="endTitle">Waktu Habis!</div>
      <div class="result-card" id="endBody"></div>
      <button id="playAgainBtn" class="btn">Main Lagi</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var GAME_DURATION = 60000;
  var HOLE_COUNT = 9;
  var BEST_SCORE_KEY = "whackAMoleBestScore";
  var EMOJI = { mole: "🐭", bomb: "💣", unicorn: "🦄", dragon: "🐉" };
  var POINT_VALUES = { mole: 10, unicorn: 20, dragon: 50 };

  // ===== DOM =====
  var startScreenEl = document.getElementById("startScreen");
  var gameScreenEl = document.getElementById("gameScreen");
  var endScreenEl = document.getElementById("endScreen");

  var startBtn = document.getElementById("startBtn");
  var playAgainBtn = document.getElementById("playAgainBtn");
  var bestScoreStartEl = document.getElementById("bestScoreStart");

  var scoreValueEl = document.getElementById("scoreValue");
  var comboValueEl = document.getElementById("comboValue");
  var comboBoxEl = document.getElementById("comboBox");
  var bestScoreValueEl = document.getElementById("bestScoreValue");
  var timerBarEl = document.getElementById("timerBar");
  var boardEl = document.getElementById("board");

  var trophyDisplayEl = document.getElementById("trophyDisplay");
  var endTitleEl = document.getElementById("endTitle");
  var endBodyEl = document.getElementById("endBody");

  // ===== State =====
  var gameRunning = false;
  var paused = false;
  var elapsedGame = 0;
  var lastFrameTime = null;
  var nextSpawnAt = 0;
  var rafId = null;

  var holes = [];
  var score = 0, combo = 0, longestCombo = 0;
  var stats = { mole: 0, unicorn: 0, dragon: 0, bomb: 0, missed: 0 };

  var landscapeQuery = window.matchMedia("(orientation: landscape) and (pointer: coarse)");

  // ===== Bantuan umum =====
  function lerp(a, b, t) { return a + (b - a) * t; }
  function vibrate(pattern) { if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} } }
  function getBestScore() { try { var v = localStorage.getItem(BEST_SCORE_KEY); return v ? parseInt(v, 10) : 0; } catch (e) { return 0; } }
  function setBestScore(v) { try { localStorage.setItem(BEST_SCORE_KEY, String(v)); } catch (e) {} }
  function showScreen(name) {
    startScreenEl.classList.toggle("hidden", name !== "start");
    gameScreenEl.classList.toggle("hidden", name !== "game");
    endScreenEl.classList.toggle("hidden", name !== "end");
  }
  function bindButton(el, handler) {
    var touched = false;
    el.addEventListener("touchstart", function (e) {
      e.preventDefault(); touched = true; handler();
      setTimeout(function () { touched = false; }, 400);
    }, { passive: false });
    el.addEventListener("click", function () { if (!touched) handler(); });
  }

  // ===== Bangun papan 9 lubang =====
  for (var i = 0; i < HOLE_COUNT; i++) {
    (function () {
      var holeEl = document.createElement("div");
      holeEl.className = "hole";
      var burrowEl = document.createElement("div");
      burrowEl.className = "burrow";
      var critterEl = document.createElement("div");
      critterEl.className = "critter";
      holeEl.appendChild(burrowEl);
      holeEl.appendChild(critterEl);
      boardEl.appendChild(holeEl);

      var holeData = { el: holeEl, critterEl: critterEl, active: false, type: null, expireAt: 0, visualToken: 0 };
      holes.push(holeData);

      holeEl.addEventListener("touchstart", function (e) {
        e.preventDefault();
        handleHoleTouch(holeData);
      }, { passive: false });
    })();
  }

  // ===== Logika kemunculan karakter =====
  function pickSpawnType(progress) {
    var r = Math.random();
    var dragonChance = 0.015, unicornChance = 0.045;
    var bombChance = lerp(0.15, 0.28, progress);
    if (r < dragonChance) return "dragon";
    if (r < dragonChance + unicornChance) return "unicorn";
    if (r < dragonChance + unicornChance + bombChance) return "bomb";
    return "mole";
  }
  function durationForType(type, progress) {
    if (type === "dragon") return lerp(480, 350, progress);
    if (type === "unicorn") return lerp(700, 500, progress);
    return lerp(1450, 620, progress) * (0.9 + Math.random() * 0.2);
  }
  function getFreeHoles() {
    var free = [];
    for (var i = 0; i < holes.length; i++) if (!holes[i].active) free.push(holes[i]);
    return free;
  }
  function spawnOne(holeData, progress) {
    var type = pickSpawnType(progress);
    var duration = durationForType(type, progress);
    holeData.visualToken++;
    holeData.type = type;
    holeData.active = true;
    holeData.expireAt = elapsedGame + duration;
    var el = holeData.critterEl;
    el.textContent = EMOJI[type];
    el.className = "critter pop";
    holeData.el.classList.toggle("special-unicorn", type === "unicorn");
    holeData.el.classList.toggle("special-dragon", type === "dragon");
  }
  function doSpawnWave(progress) {
    var free = getFreeHoles();
    if (!free.length) return;
    var doubleChance = lerp(0.04, 0.36, progress);
    var count = (free.length > 1 && Math.random() < doubleChance) ? 2 : 1;
    var shuffled = free.slice().sort(function () { return Math.random() - 0.5; });
    for (var j = 0; j < count; j++) spawnOne(shuffled[j], progress);
  }
  function scheduleNextSpawnWave(progress) {
    var base = lerp(980, 430, progress);
    nextSpawnAt = elapsedGame + base * (0.75 + Math.random() * 0.5);
  }

  // ===== Animasi & efek =====
  function playHitAnimation(holeData, type) {
    holeData.visualToken++;
    var myToken = holeData.visualToken;
    var el = holeData.critterEl;
    el.className = "critter hit";
    if (type === "bomb") {
      holeData.el.classList.add("danger-flash");
      setTimeout(function () { holeData.el.classList.remove("danger-flash"); }, 300);
    }
    setTimeout(function () {
      if (holeData.visualToken !== myToken) return;
      el.className = "critter"; el.textContent = "";
      holeData.el.classList.remove("special-unicorn", "special-dragon");
    }, 280);
  }
  function playRetreatAnimation(holeData) {
    holeData.visualToken++;
    var myToken = holeData.visualToken;
    var el = holeData.critterEl;
    el.className = "critter retreat";
    setTimeout(function () {
      if (holeData.visualToken !== myToken) return;
      el.className = "critter"; el.textContent = "";
      holeData.el.classList.remove("special-unicorn", "special-dragon");
    }, 220);
  }
  function clearHoleVisual(holeData) {
    holeData.visualToken++;
    holeData.active = false; holeData.type = null;
    holeData.critterEl.className = "critter"; holeData.critterEl.textContent = "";
    holeData.el.classList.remove("special-unicorn", "special-dragon");
  }
  function showFloatingScore(holeData, points) {
    var el = document.createElement("div");
    el.className = "float-score" + (points < 0 ? " negative" : "");
    el.textContent = (points > 0 ? "+" : "") + points;
    holeData.el.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 700);
  }
  function showRareBanner(type) {
    var banner = document.createElement("div");
    banner.className = "rare-banner";
    banner.textContent = type === "dragon" ? "🐉 Naga Emas!" : "🦄 Unicorn!";
    boardEl.appendChild(banner);
    setTimeout(function () { if (banner.parentNode) banner.parentNode.removeChild(banner); }, 850);
  }

  // ===== Resolusi pukulan & kehilangan target =====
  function resolveHit(holeData) {
    var type = holeData.type;
    holeData.active = false; holeData.type = null;

    if (type === "bomb") {
      score = Math.max(0, score - 20);
      combo = 0;
      stats.bomb++;
      playHitAnimation(holeData, type);
      showFloatingScore(holeData, -20);
      vibrate([20, 20, 20]);
    } else {
      combo++;
      if (combo > longestCombo) longestCombo = combo;
      var mult = Math.min(combo, 5);
      var pts = POINT_VALUES[type] * mult;
      score += pts;
      stats[type]++;
      playHitAnimation(holeData, type);
      showFloatingScore(holeData, pts);
      showComboPulse();
      if (type === "dragon") { vibrate([15, 10, 15, 10, 20]); showRareBanner(type); }
      else if (type === "unicorn") { vibrate([10, 8, 14]); showRareBanner(type); }
      else vibrate(12);
    }
    updateScoreUI();
  }
  function expireHole(holeData) {
    var type = holeData.type;
    holeData.active = false; holeData.type = null;
    if (type === "bomb") {
      playRetreatAnimation(holeData);
    } else {
      combo = 0;
      stats.missed++;
      playRetreatAnimation(holeData);
      updateScoreUI();
    }
  }
  function handleHoleTouch(holeData) {
    if (!gameRunning || paused) return;
    if (!holeData.active || !holeData.type) return;
    resolveHit(holeData);
  }

  // ===== Update tampilan =====
  function updateScoreUI() {
    scoreValueEl.textContent = score;
    bestScoreValueEl.textContent = getBestScore();
    var m = Math.min(Math.max(combo, 1), 5);
    comboValueEl.textContent = "x" + m;
    comboValueEl.classList.toggle("active", combo > 1);
  }
  function showComboPulse() {
    comboBoxEl.classList.remove("pulse");
    void comboBoxEl.offsetWidth;
    comboBoxEl.classList.add("pulse");
  }
  function updateTimerUI() {
    var remaining = Math.max(0, GAME_DURATION - elapsedGame);
    var pct = (remaining / GAME_DURATION) * 100;
    timerBarEl.style.width = pct + "%";
    timerBarEl.classList.remove("warn", "danger");
    if (pct <= 20) timerBarEl.classList.add("danger");
    else if (pct <= 50) timerBarEl.classList.add("warn");
  }

  // ===== Jeda otomatis saat miring / berpindah aplikasi =====
  function updatePausedState() {
    var shouldPause = document.hidden || landscapeQuery.matches;
    if (shouldPause === paused) return;
    paused = shouldPause;
    if (!shouldPause) lastFrameTime = null;
  }

  // ===== Mulai & akhiri permainan =====
  function startGame() {
    gameRunning = true; paused = false;
    score = 0; combo = 0; longestCombo = 0;
    stats = { mole: 0, unicorn: 0, dragon: 0, bomb: 0, missed: 0 };
    elapsedGame = 0; lastFrameTime = null; nextSpawnAt = 400;

    for (var i = 0; i < holes.length; i++) clearHoleVisual(holes[i]);

    trophyDisplayEl.classList.add("hidden");
    updateScoreUI();
    updateTimerUI();
    showScreen("game");

    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(gameLoop);
  }

  function endGame() {
    gameRunning = false;
    if (rafId) cancelAnimationFrame(rafId);
    for (var i = 0; i < holes.length; i++) clearHoleVisual(holes[i]);

    var best = getBestScore();
    var isChampion = score > best;
    if (isChampion) setBestScore(score);

    var total = stats.mole + stats.unicorn + stats.dragon + stats.missed + stats.bomb;
    var good = stats.mole + stats.unicorn + stats.dragon;
    var accuracy = total > 0 ? Math.round((good / total) * 100) : 0;

    trophyDisplayEl.classList.toggle("hidden", !isChampion);
    endTitleEl.textContent = isChampion ? "🏆 Juara Baru!" : "Waktu Habis!";
    endTitleEl.classList.toggle("champion", isChampion);

    endBodyEl.innerHTML =
      '<div class="result-row"><span>Skor Akhir</span><strong>' + score + '</strong></div>' +
      '<div class="result-row"><span>Combo Terpanjang</span><strong>' + longestCombo + '</strong></div>' +
      '<div class="result-row"><span>Akurasi</span><strong>' + accuracy + '%</strong></div>' +
      '<div class="result-row"><span>Skor Terbaik</span><strong>' + getBestScore() + '</strong></div>' +
      (stats.dragon > 0 ? '<div class="result-row"><span>🐉 Naga Ditangkap</span><strong>' + stats.dragon + '</strong></div>' : '') +
      (stats.unicorn > 0 ? '<div class="result-row"><span>🦄 Unicorn Ditangkap</span><strong>' + stats.unicorn + '</strong></div>' : '');

    showScreen("end");
  }

  // ===== Loop utama =====
  function gameLoop(now) {
    if (!gameRunning) return;
    if (!paused) {
      var dt = (lastFrameTime === null) ? 0 : Math.min(now - lastFrameTime, 50);
      elapsedGame += dt;
      var progress = Math.min(elapsedGame / GAME_DURATION, 1);

      if (elapsedGame >= nextSpawnAt) { doSpawnWave(progress); scheduleNextSpawnWave(progress); }
      for (var i = 0; i < holes.length; i++) {
        var h = holes[i];
        if (h.active && elapsedGame >= h.expireAt) expireHole(h);
      }
      updateTimerUI();

      if (elapsedGame >= GAME_DURATION) { lastFrameTime = now; endGame(); return; }
    }
    lastFrameTime = now;
    rafId = requestAnimationFrame(gameLoop);
  }

  // ===== Inisialisasi =====
  bindButton(startBtn, startGame);
  bindButton(playAgainBtn, startGame);

  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

  landscapeQuery.addEventListener("change", updatePausedState);
  document.addEventListener("visibilitychange", updatePausedState);
  updatePausedState();

  bestScoreStartEl.textContent = getBestScore();
  showScreen("start");
})();
</script>
</body>
</html>
